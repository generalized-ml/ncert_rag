# RAG System Configuration

# Data sources
subjects:
  physics:
    name: "Physics"
    class_11:
      - "keph1dd"
    class_12:
      - "leph1dd"
  chemistry:
    name: "Chemistry"
    class_11:
      - "kech1dd"
      - "kech2dd"
    class_12:
      - "lech1dd"
      - "lech2dd"
  biology:
    name: "Biology"
    class_11:
      - "kebo1dd"
    class_12:
      - "lebo1dd"

# PDF processing
pdf_processing:
  extract_images: false
  extract_tables: true
  min_paragraph_length: 50
  remove_headers_footers: true

# Text chunking
chunking:
  strategy: "recursive"  # recursive, semantic, fixed
  chunk_size: 1000
  chunk_overlap: 200
  separators: ["\n\n", "\n", ". ", " ", ""]
  metadata_fields:
    - subject
    - class
    - chapter
    - page_number

# Embedding
embedding:
  provider: "sentence-transformers"  # sentence-transformers, openai, huggingface
  model_name: "all-MiniLM-L6-v2"
  dimension: 384
  batch_size: 32
  normalize: true

# Vector store
vector_store:
  type: "chromadb"  # chromadb, faiss, qdrant
  collection_name: "ncert_neet"
  persist_directory: "data/vector_store"
  distance_metric: "cosine"

# Retrieval
retrieval:
  strategy: "hybrid"  # dense, sparse, hybrid
  top_k: 5
  similarity_threshold: 0.7
  rerank: true
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# Generation
generation:
  provider: "openai"  # openai, anthropic, local
  model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 1024
  system_prompt: |
    You are a helpful NEET exam tutor. Answer questions using ONLY the provided NCERT textbook context.
    If the context doesn't contain enough information, say so honestly.
    Provide clear, concise explanations suitable for NEET preparation.
    When relevant, mention the class and chapter the information comes from.

# Evaluation
evaluation:
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall
  test_dataset: "data/evaluation/test_questions.json"

# API
api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]
  rate_limit: 100  # requests per minute